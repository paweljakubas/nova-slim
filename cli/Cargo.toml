[package]
name = "nova-slim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NovaSlim CLI — curve-agnostic Nova IVC folding with slim proofs"

[lib]
name = "nova_slim"
path = "src/lib.rs"

[[bin]]
name = "nova-slim"
path = "src/main.rs"

[dependencies]
prover = { path = "../prover" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rand = "0.8"
tempfile = "3"

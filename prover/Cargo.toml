[package]
name = "prover"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "NovaSlim — curve-agnostic Nova IVC folding with sumcheck compression and slim proofs"

[dependencies]
ark-bls12-381 = { version = "0.4", optional = true }
ark-bn254 = { version = "0.4", optional = true }
ark-pallas = { version = "0.4", optional = true }
ark-vesta = { version = "0.4", optional = true }
ark-ed-on-bls12-381-bandersnatch = { version = "0.4.1", package = "sp-ark-ed-on-bls12-381-bandersnatch", optional = true }
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
blake2 = "0.10"
ciborium = "0.2"
hex = "0.4"
nom = "7"
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# Pinned to the exact versions bundled with Verus release
# 0.2026.09.20.aef82ed.  A newer `vstd` (e.g. 2026-10-18) panics the verifier
# with "unexpected verus diagnostic item ... rust_div", so the `=` is required.
vstd = { version = "=0.0.0-2026-09-20-0158", optional = true }
verus_builtin = { version = "=0.0.0-2026-09-16-0054", optional = true }
verus_builtin_macros = { version = "=0.0.0-2026-09-20-0158", optional = true }

[features]
default = ["bls12-381"]
bls12-381 = ["dep:ark-bls12-381"]
bn254 = ["dep:ark-bn254"]
pallas = ["dep:ark-pallas"]
vesta = ["dep:ark-vesta"]
grumpkin = ["dep:ark-bn254"]
bandersnatch = ["dep:ark-ed-on-bls12-381-bandersnatch"]
verus = ["dep:vstd", "dep:verus_builtin", "dep:verus_builtin_macros"]
# Optional native (vendored blst) MSM acceleration.  Purely additive: without
# it the Rust wrapper falls back to arkworks.
native = []

# Without this, `cargo verus verify` only *compiles* the crate and never runs
# the verification engine (no `__VERUS_DRIVER_VERIFY_*` is exported for the
# primary package), so a false assertion slips through silently.
[package.metadata.verus]
verify = true

[dev-dependencies]
proptest = "1.4"
tempfile = "3"

[build-dependencies]
cmake = "0.1"

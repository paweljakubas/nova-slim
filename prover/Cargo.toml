[package]
name = "prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NovaSlim — curve-agnostic Nova IVC folding with sumcheck compression and slim proofs"

[dependencies]
ark-bls12-381 = { version = "0.4", optional = true }
ark-bn254 = { version = "0.4", optional = true }
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
blake2 = "0.10"
ciborium = "0.2"
hex = "0.4"
nom = "7"
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"

[features]
default = ["bls12-381"]
bls12-381 = ["dep:ark-bls12-381"]
bn254 = ["dep:ark-bn254"]

[dev-dependencies]
proptest = "1.4"
tempfile = "3"
